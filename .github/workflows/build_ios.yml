name: Build iOS (unsigned IPA)

# Builds the iPhone version on a GitHub macOS machine (iOS apps cannot be built on Windows).
# The IPA is NOT signed: install it on an iPhone with AltStore or Sideloadly using your own
# Apple ID (free Apple ID apps expire after 7 days), or sign it with an Apple Developer account.

on:
  workflow_dispatch:
  push:
    branches: [ "improvements" ]
    paths:
      - "fake_currency_detector/**"
      - ".github/workflows/build_ios.yml"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./fake_currency_detector
        run: flutter pub get

      - name: Build iOS (no code signing)
        working-directory: ./fake_currency_detector
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: ./fake_currency_detector
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr FakeCurrencyDetector-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: fake_currency_detector/FakeCurrencyDetector-unsigned.ipa
