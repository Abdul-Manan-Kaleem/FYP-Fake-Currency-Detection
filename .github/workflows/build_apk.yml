name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually click a button to build an APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The Android build of the current app needs JDK 21 (Android Gradle Plugin 9.x).
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./fake_currency_detector
        run: flutter pub get

      - name: Run Tests
        working-directory: ./fake_currency_detector
        run: flutter test

      - name: Compile Release APK
        working-directory: ./fake_currency_detector
        run: flutter build apk --release --split-per-abi

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Currency-Screening-App-APK
          path: fake_currency_detector/build/app/outputs/flutter-apk/*.apk
